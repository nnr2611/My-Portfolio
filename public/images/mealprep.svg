<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="360" rx="16" fill="#f4f8f1"/>
  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3d2b">MealPrep Deals</text>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#5b6b61">Recipes + live flyer deals = a priced weekly batch-cook plan</text>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker></defs>
  <g stroke="#cfe0d3" stroke-width="1.5">
    <rect x="30" y="100" width="150" height="150" rx="12" fill="#fff"/>
    <rect x="245" y="100" width="150" height="150" rx="12" fill="#fff"/>
    <rect x="460" y="100" width="150" height="150" rx="12" fill="#fff"/>
  </g>
  <!-- recipe book -->
  <g transform="translate(75,120)">
    <rect width="60" height="70" rx="5" fill="#e8a33d"/><rect x="8" y="0" width="52" height="70" rx="4" fill="#fff3d6" stroke="#e8a33d" stroke-width="2"/>
    <g stroke="#c9922f" stroke-width="3" stroke-linecap="round"><path d="M20 18h30M20 30h30M20 42h20"/></g>
  </g>
  <text x="105" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1f3d2b">Recipe books</text>
  <text x="105" y="239" text-anchor="middle" font-size="11" fill="#5b6b61">Claude extracts recipes</text>
  <!-- flyer -->
  <g transform="translate(290,122)">
    <rect width="60" height="66" rx="6" fill="#fde8e4" stroke="#d8553f" stroke-width="2"/>
    <circle cx="30" cy="24" r="14" fill="#d8553f"/><text x="30" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">$</text>
    <g stroke="#d8553f" stroke-width="3" stroke-linecap="round"><path d="M12 48h36M12 58h24"/></g>
  </g>
  <text x="320" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1f3d2b">Flyer deals</text>
  <text x="320" y="239" text-anchor="middle" font-size="11" fill="#5b6b61">Local store prices</text>
  <!-- plan -->
  <g transform="translate(505,122)">
    <rect width="60" height="66" rx="6" fill="#e3f2e8" stroke="#2f7d4f" stroke-width="2"/>
    <rect x="0" y="0" width="60" height="16" rx="6" fill="#2f7d4f"/>
    <g fill="#2f7d4f"><rect x="8" y="24" width="10" height="10" rx="2"/><rect x="25" y="24" width="10" height="10" rx="2"/><rect x="42" y="24" width="10" height="10" rx="2"/><rect x="8" y="40" width="10" height="10" rx="2"/><rect x="25" y="40" width="10" height="10" rx="2"/></g>
  </g>
  <text x="535" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1f3d2b">Weekly plan</text>
  <text x="535" y="239" text-anchor="middle" font-size="11" fill="#5b6b61">Cost, calories, shopping list</text>
  <path d="M184 175h54" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#a)"/><path d="M399 175h54" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="150" y="285" width="340" height="40" rx="20" fill="#2f7d4f"/>
  <text x="320" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Totals computed in code, never by the LLM</text>
</svg>
