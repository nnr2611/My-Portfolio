<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="360" rx="16" fill="#f3f6f8"/>
  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1b3a4b">Beijing Air Pollution Prediction</text>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#5a6b76">LSTM + XGBoost hybrid forecasting PM2.5, 24 hours to 7 days ahead</text>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a7ca3"/></marker></defs>
  <g stroke="#2a7ca3" stroke-width="2.5" fill="none">
    <path d="M142 130h22" marker-end="url(#a)"/><path d="M262 130h22" marker-end="url(#a)"/>
    <path d="M382 130h22" marker-end="url(#a)"/><path d="M502 130h22" marker-end="url(#a)"/>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#fff">
    <rect x="22" y="100" width="118" height="60" rx="10" fill="#6aaa7e"/><text x="81" y="127">Kaggle data</text><text x="81" y="144" font-size="10" font-weight="400">12 stations</text>
    <rect x="166" y="100" width="94" height="60" rx="10" fill="#e8a33d"/><text x="213" y="127">Features</text><text x="213" y="144" font-size="10" font-weight="400">lags, rolling</text>
    <rect x="286" y="100" width="94" height="60" rx="10" fill="#2a7ca3"/><text x="333" y="135">LSTM</text>
    <rect x="406" y="100" width="94" height="60" rx="10" fill="#6b6fc4"/><text x="453" y="135">XGBoost</text>
    <rect x="526" y="100" width="94" height="60" rx="10" fill="#a45cbf"/><text x="573" y="127">Hybrid</text><text x="573" y="144" font-size="10" font-weight="400">forecast</text>
  </g>
  <!-- chart -->
  <rect x="60" y="195" width="520" height="130" rx="12" fill="#fff" stroke="#d5e0e6" stroke-width="1.5"/>
  <text x="80" y="217" font-size="12" font-weight="600" fill="#1b3a4b">Streamlit dashboard: forecast vs actual PM2.5</text>
  <g stroke="#e3eaee" stroke-width="1"><path d="M80 245h480M80 275h480M80 305h480"/></g>
  <path d="M80 290 L120 270 L160 285 L200 250 L240 275 L280 240 L320 268 L360 255 L400 285 L440 262 L480 275 L520 250 L560 268" stroke="#2a7ca3" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <path d="M80 286 L120 274 L160 282 L200 256 L240 272 L280 248 L320 266 L360 258 L400 281 L440 266 L480 272 L520 256 L560 266" stroke="#e8793d" stroke-width="2" stroke-dasharray="6 4" fill="none" stroke-linejoin="round"/>
  <g font-size="10" fill="#5a6b76"><rect x="430" y="207" width="14" height="3" fill="#2a7ca3"/><text x="450" y="212">Actual</text><rect x="500" y="207" width="14" height="3" fill="#e8793d"/><text x="520" y="212">Predicted</text></g>
</svg>
